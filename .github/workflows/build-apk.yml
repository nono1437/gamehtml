# 4399 游戏盒 - APK 构建 Workflow
#
# 触发方式：
# 1) 手动触发（GitHub 仓库 → Actions → Build APK → Run workflow）
# 2) nono 二改分支 push 时自动跑单测 + Debug APK，方便手机端持续验收

name: Build APK

on:
  workflow_dispatch:
    inputs:
      build_type:
        description: 构建类型
        required: true
        type: choice
        default: debug
        options:
          - debug
          - release
          - both
  push:
    branches:
      - nono-4399-qol

concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      # ---------- 1. 检出代码 ----------
      - name: Checkout
        uses: actions/checkout@v4

      # ---------- 2. 应用 nono 二改补丁 ----------
      - name: Apply nono QoL patch
        run: |
          git apply --recount --check .nono/4399-qol.patch
          git apply --recount .nono/4399-qol.patch

      # ---------- 3. 配置 JDK 17 ----------
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # ---------- 4. 验证 Android SDK（ubuntu-latest 已预装） ----------
      - name: Verify Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          echo ""
          echo "=== 已安装的 platforms ==="
          ls -la "$ANDROID_HOME/platforms/" 2>/dev/null || echo "platforms 目录不存在"
          echo ""
          echo "=== 已安装的 build-tools ==="
          ls -la "$ANDROID_HOME/build-tools/" 2>/dev/null || echo "build-tools 目录不存在"
          echo ""
          if [ ! -d "$ANDROID_HOME/platforms/android-35" ]; then
            echo "android-35 缺失，正在安装..."
            yes | sdkmanager "platforms;android-35" > /dev/null 2>&1 || true
          fi
          if [ ! -d "$ANDROID_HOME/build-tools/35.0.0" ]; then
            echo "build-tools;35.0.0 缺失，正在安装..."
            yes | sdkmanager "build-tools;35.0.0" > /dev/null 2>&1 || true
          fi
          echo ""
          echo "=== 最终验证 ==="
          ls "$ANDROID_HOME/platforms/" 2>/dev/null
          ls "$ANDROID_HOME/build-tools/" 2>/dev/null

      # ---------- 5. 生成 Gradle Wrapper ----------
      - name: Generate Gradle Wrapper
        run: |
          echo "=== 诊断：预装的 Gradle init 脚本 ==="
          ls -la ~/.gradle/init.d/ 2>/dev/null || echo "~/.gradle/init.d/ 不存在"
          for f in ~/.gradle/init.d/*.gradle; do
            [ -f "$f" ] && echo "--- $f ---" && head -15 "$f"
          done 2>/dev/null || true
          echo ""
          echo "=== 系统 Gradle 版本 ==="
          gradle --version 2>/dev/null | head -5 || true
          echo ""

          if [ ! -f gradle/wrapper/gradle-wrapper.jar ] || [ ! -f gradlew ]; then
            echo "Gradle wrapper 缺失，正在生成..."
            gradle wrapper --gradle-version 8.7 --distribution-type bin
          else
            echo "Gradle wrapper 已存在"
          fi
          chmod +x gradlew
          ./gradlew --version

      # ---------- 6. 单元测试 ----------
      - name: Run unit tests
        run: ./gradlew testDebugUnitTest --stacktrace

      # ---------- 7. 准备 Release 签名 ----------
      - name: Prepare signing key
        env:
          SIGNING_KEY_BASE64: ${{ secrets.SIGNING_KEY_BASE64 }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
        run: |
          if [ -z "$SIGNING_KEY_BASE64" ]; then
            echo "未配置签名 Secrets，使用内置 debug.keystore 签名（可用 MT 管理器重新签名）"
          else
            echo "检测到签名 Secrets，解码 keystore..."
            echo "$SIGNING_KEY_BASE64" | base64 -d > app/release.keystore
            cat > app/keystore.properties <<EOF
          storeFile=release.keystore
          storePassword=$SIGNING_STORE_PASSWORD
          keyAlias=$SIGNING_KEY_ALIAS
          keyPassword=$SIGNING_KEY_PASSWORD
          EOF
            echo "✓ keystore.properties 已生成"
          fi

      # ---------- 8. 构建 Debug APK ----------
      - name: Build Debug APK
        if: ${{ github.event_name == 'push' || inputs.build_type == 'debug' || inputs.build_type == 'both' }}
        run: ./gradlew assembleDebug --stacktrace

      # ---------- 9. 构建 Release APK ----------
      - name: Build Release APK
        if: ${{ github.event_name == 'workflow_dispatch' && (inputs.build_type == 'release' || inputs.build_type == 'both') }}
        run: ./gradlew assembleRelease --stacktrace

      # ---------- 10. 收集 APK ----------
      - name: Collect APKs
        run: |
          echo "=== 构建产物 ==="
          find app/build/outputs/apk -name "*.apk" 2>/dev/null || echo "未找到 APK"

          VERSION=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts | head -1)
          SHORT_SHA=$(git rev-parse --short HEAD)
          DATE=$(date +'%Y%m%d')
          SUFFIX="${VERSION}-${SHORT_SHA}-${DATE}"

          mkdir -p artifacts
          [ -f app/build/outputs/apk/debug/app-debug.apk ] && \
            cp app/build/outputs/apk/debug/app-debug.apk artifacts/Game4399-${SUFFIX}-debug.apk
          [ -f app/build/outputs/apk/release/app-release.apk ] && \
            cp app/build/outputs/apk/release/app-release.apk artifacts/Game4399-${SUFFIX}-release.apk
          [ -f app/build/outputs/apk/release/app-release-unsigned.apk ] && \
            cp app/build/outputs/apk/release/app-release-unsigned.apk artifacts/Game4399-${SUFFIX}-release-unsigned.apk

          echo "=== artifacts 目录 ==="
          ls -lh artifacts/ 2>/dev/null || echo "artifacts 为空"

      # ---------- 11. 上传 Artifact ----------
      - name: Upload Debug APK
        if: ${{ github.event_name == 'push' || inputs.build_type == 'debug' || inputs.build_type == 'both' }}
        uses: actions/upload-artifact@v4
        with:
          name: Game4399-debug
          path: artifacts/*-debug*.apk
          retention-days: 90
          if-no-files-found: warn

      - name: Upload Release APK
        if: ${{ github.event_name == 'workflow_dispatch' && (inputs.build_type == 'release' || inputs.build_type == 'both') }}
        uses: actions/upload-artifact@v4
        with:
          name: Game4399-release
          path: artifacts/*-release*.apk
          retention-days: 90
          if-no-files-found: warn

      # ---------- 12. 构建摘要 ----------
      - name: Summary
        if: always()
        run: |
          echo "## 构建结果" >> $GITHUB_STEP_SUMMARY
          echo "- 触发方式: \`${{ github.event_name }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- 提交: \`${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY
          if [ -d artifacts ] && [ "$(ls -A artifacts 2>/dev/null)" ]; then
            echo "### 产物" >> $GITHUB_STEP_SUMMARY
            ls -lh artifacts/ | awk 'NR>1 {print "- `" $NF "` (" $5 ")"}' >> $GITHUB_STEP_SUMMARY
          else
            echo "### ⚠️ 无产物" >> $GITHUB_STEP_SUMMARY
          fi
