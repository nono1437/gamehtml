<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
<title>4399 Flash 播放器</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 100%; height: 100%; background: #000; overflow: hidden;
    font-family: "Microsoft YaHei", "微软雅黑", "Noto Sans CJK SC", "Source Han Sans SC",
                 "PingFang SC", "Heiti SC", "SimHei", "WenQuanYi Micro Hei",
                 Arial, Helvetica, sans-serif;
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
  }
  #stage {
    position: fixed; inset: 0; width: 100%; height: 100%; background: #000;
    display: flex; align-items: center; justify-content: center;
  }
  #stage canvas, #stage ruffle-player {
    font-family: "Microsoft YaHei", "微软雅黑", "Noto Sans CJK SC", "Source Han Sans SC",
                 "PingFang SC", "Heiti SC", "SimHei", "WenQuanYi Micro Hei",
                 Arial, Helvetica, sans-serif !important;
  }
  #loading {
    position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
    flex-direction: column; color: #FFC107; font-family: -apple-system, "Microsoft YaHei", sans-serif;
    z-index: 10; background: #000;
  }
  .spinner {
    width: 48px; height: 48px; border: 4px solid rgba(255,193,7,.25);
    border-top-color: #FFC107; border-radius: 50%; animation: spin 1s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  #loading .text { margin-top: 16px; font-size: 15px; letter-spacing: 1px; }
  #hint {
    position: fixed; bottom: 16px; left: 0; right: 0; text-align: center;
    color: rgba(255,255,255,.5); font-size: 12px; z-index: 10; pointer-events: none;
  }
  #seer2-login-error:not([hidden]) {
    position: fixed; z-index: 20; top: 12px; left: 12px; right: 64px;
    display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
    width: fit-content; max-width: calc(100% - 76px); padding: 10px 12px;
    border-radius: 8px; background: #172843; color: #fff; font-size: 14px;
  }
  #seer2-login-error button {
    border: 1px solid #90b6ec; border-radius: 4px; padding: 6px 10px;
    color: #fff; background: #294b78; font: inherit;
  }
</style>
</head>
<body>
  <div id="stage"></div>
  <div id="loading">
    <div class="spinner"></div>
    <div class="text" id="loadText">正在加载 Flash 引擎…</div>
  </div>
  <div id="hint">提示：可在右上角开启虚拟手柄，或连接实体键盘游玩</div>
  <div id="seer2-login-error" role="alert" hidden>
    <span></span>
    <button type="button">重新加载</button>
  </div>

  <script src="seer2-socket.js"></script>
  <script>
    // 解析查询参数
    function param(name, def) {
      return new URLSearchParams(location.search).get(name) || def || '';
    }
    var SWF_URL    = param('swf');
    var BASE_URL   = param('base');
    var TITLE      = param('title') || 'Flash 游戏';
    var ENGINE     = param('engine', 'ruffle');
    var IS_SEER2   = param('profile') === 'seer2';
    var CDN_URL    = param('cdn', '');
    var CDN_PATH   = param('path', '');
    var AUTOPLAY   = param('autoplay', 'on');

    if (IS_SEER2) {
      document.addEventListener('securitypolicyviolation', function (event) {
        if (event.effectiveDirective === 'connect-src') {
          try {
            var blocked = new URL(event.blockedURI);
            console.warn('FlashDiagnostic blocked ' + blocked.origin + blocked.pathname);
          } catch (_) {}
        }
      });
      // Keep HTTP requests in the asset relay. The official TCP transport uses the native bridge.
      var policy = document.createElement('meta');
      policy.httpEquiv = 'Content-Security-Policy';
      policy.content = "connect-src 'self' https:";
      document.head.appendChild(policy);
    }

    document.title = TITLE;
    var loadText = document.getElementById('loadText');
    var stage = document.getElementById('stage');

    // ===== Ruffle 引擎 =====
    loadText.textContent = '正在加载 Ruffle 引擎…';

    var seer2Tcp = IS_SEER2 && SWF_URL === 'https://flash.local/_seer2/Client.swf' &&
      BASE_URL === 'https://flash.local/_seer2/' && window.installSeer2Socket && window.installSeer2Socket();
    var bundledPath = seer2Tcp ? 'https://flash.local/ruffle/seer2/' : 'https://flash.local/ruffle/';
    var ruffleUrl = (!IS_SEER2 && CDN_URL) || bundledPath + 'ruffle.js';
    var rufflePath = (!IS_SEER2 && CDN_PATH) || bundledPath;

    // 1) 预置 Ruffle 配置（必须早于 ruffle.js）
    window.RufflePlayer = window.RufflePlayer || {};
    var ruffleConfig = {
      "publicPath": rufflePath,
      "polyfills": true,
      "autoplay": AUTOPLAY,
      "unmuteOverlay": "visible",
      "letterbox": "on",
      "upgradeToHttps": true,
      "allowScriptAccess": true,
      "scale": "showAll",
      "quality": "high",
      "allowFullscreen": false,
      "splashScreen": true,
      "preloader": true,
      "backgroundExecution": "none",
      "logLevel": "warn",
      "maxExecutionDuration": {"secs": 15, "nanos": 0}
    };
    if (IS_SEER2) {
      // The original launcher sets noScale and top-left alignment for its 1200×660 stage.
      ruffleConfig.forceScale = true;
      ruffleConfig.salign = '';
      ruffleConfig.forceAlign = true;
      if (seer2Tcp) {
        ruffleConfig.socketProxy = [{ host: '*', port: 0, proxyUrl: 'wss://flash.local/_seer2/socket' }];
        document.getElementById('hint').textContent = '官服旧版 TCP 直连 · 登录通信未加密';
      }
      ruffleConfig.urlRewriteRules = [[
        /^https?:\/\/(sr2login|ctsr2login|cncsr2login)\.61\.com\/ip\.txt(\?v=[0-9.e-]+)?$/,
        'https://flash.local/_seer2/login-discovery/$1/ip.txt$2'
      ]];

      var loginError = document.getElementById('seer2-login-error');
      loginError.querySelector('button').addEventListener('click', function() { location.reload(); });
      function showDiscoveryError(description) {
        loginError.querySelector('span').textContent = '无法获取登录服务器地址。' + description;
        loginError.hidden = false;
      }

      var fetchResource = window.fetch.bind(window);
      window.fetch = function(input, options) {
        var request = input instanceof Request ? input : null;
        var method = (options && options.method) || (request && request.method) || 'GET';
        var target;
        try { target = new URL(request ? request.url : input, location.href); }
        catch (_) { return fetchResource(input, options); }
        if (method !== 'GET' || target.origin !== location.origin ||
            !/^\/_seer2\/login-discovery\/(sr2login|ctsr2login|cncsr2login)\/ip\.txt$/.test(target.pathname)) {
          return fetchResource(input, options);
        }
        var callerSignal = (options && options.signal) || (request && request.signal);
        if (callerSignal && callerSignal.aborted) return fetchResource(input, options);
        var controller = new AbortController();
        var timedOut = false;
        function cancelDiscovery() { controller.abort(); }
        if (callerSignal) callerSignal.addEventListener('abort', cancelDiscovery, { once: true });
        var timeout = setTimeout(function() {
          timedOut = true;
          cancelDiscovery();
        }, 18000);

        loginError.hidden = true;
        return fetchResource(input, Object.assign({}, options, {
          signal: controller.signal, credentials: 'omit'
        })).then(function(response) {
          if (!response.ok) {
            var reason = response.status === 504 ? '查询超时。' :
              response.status === 415 ? '服务器响应格式无效。' : '请求失败（HTTP ' + response.status + '）。';
            showDiscoveryError(reason);
          }
          return response;
        }, function(error) {
          if (timedOut) {
            console.warn('FlashDiagnostic seer2.discovery.timeout');
            showDiscoveryError('查询超时。');
          } else if (!callerSignal || !callerSignal.aborted) {
            console.warn('FlashDiagnostic seer2.discovery.error');
            showDiscoveryError('网络连接失败。');
          }
          throw error;
        }).finally(function() {
          clearTimeout(timeout);
          if (callerSignal) callerSignal.removeEventListener('abort', cancelDiscovery);
        });
      };
    }
    // 本地引擎模式：加载 simhei.ttf 字体解决中文显示问题
    if (rufflePath.indexOf('flash.local') >= 0) {
      ruffleConfig.fontSources = [(seer2Tcp ? 'https://flash.local/ruffle/' : rufflePath) + 'simhei.ttf'];
      ruffleConfig.defaultFonts = {
        "sans": ["SimHei"],
        "serif": ["SimHei"],
        "typewriter": ["SimHei"],
        "japaneseGothic": ["SimHei"],
        "japaneseGothicMono": ["SimHei"],
        "japaneseMincho": ["SimHei"]
      };
    }
    window.RufflePlayer.config = ruffleConfig;

    function forEachPlayer(fn) {
      var players = document.querySelectorAll('ruffle-player');
      for (var i = 0; i < players.length; i++) {
        try { fn(players[i]); } catch (e) {}
      }
    }
    window.__nonoSuspendRuffle = function() {
      forEachPlayer(function(player) {
        try { player.ruffle(1).suspend(); }
        catch (e) { try { player.pause(); } catch (_) {} }
      });
    };
    window.__nonoResumeRuffle = function() {
      forEachPlayer(function(player) {
        try { player.ruffle(1).resume(); }
        catch (e) { try { player.play(); } catch (_) {} }
      });
    };
    document.addEventListener('visibilitychange', function() {
      if (document.hidden) window.__nonoSuspendRuffle();
      else window.__nonoResumeRuffle();
    });
    window.addEventListener('pagehide', window.__nonoSuspendRuffle);
    window.addEventListener('blur', window.__nonoSuspendRuffle);
    window.addEventListener('focus', window.__nonoResumeRuffle);

    // 2) 动态加载 Ruffle
    var s = document.createElement('script');
    s.src = ruffleUrl;
    s.async = true;
    s.onload = function () {
      loadText.textContent = '正在加载游戏: ' + TITLE;
      try {
        var ruffle = window.RufflePlayer.newest();
        var player = ruffle.createPlayer();
        stage.appendChild(player);
        player.style.width = '100%';
        player.style.height = '100%';
        player.style.display = 'block';
        player.style.margin = 'auto';
        var opt = { url: SWF_URL, allowScriptAccess: true };
        if (BASE_URL) opt.base = BASE_URL;
        player.addEventListener('loadeddata', function () {
          document.getElementById('loading').style.display = 'none';
          console.info('FlashDiagnostic ruffle.root.ready');
        }, { once: true });
        player.ruffle().load(opt).then(function () {
          document.getElementById('loading').style.display = 'none';
        }, function () {
          loadText.textContent = 'SWF 加载失败，请查看资源诊断';
          console.error('FlashDiagnostic ruffle.root.error');
        });
      } catch (e) {
        loadText.textContent = '加载失败: ' + e.message;
        console.error('FlashDiagnostic ruffle.root.error');
      }
    };
    s.onerror = function () {
      loadText.textContent = 'Ruffle 引擎加载失败，请检查网络';
      console.error('FlashDiagnostic ruffle.root.error');
    };
    document.head.appendChild(s);

    // 暴露给 Android 调用的播放接口
    window.__playSwf = function(url, base) {
      try {
        var ruffle = window.RufflePlayer.newest();
        var player = ruffle.createPlayer();
        stage.innerHTML = '';
        stage.appendChild(player);
        player.style.width = '100%';
        player.style.height = '100%';
        player.style.display = 'block';
        player.style.margin = 'auto';
        var opt = { url: url, allowScriptAccess: true };
        if (base) opt.base = base;
        player.ruffle().load(opt);
      } catch(e) { console.error(e); }
    };

    // 禁用长按选择 / 上下文菜单 / 缩放
    document.addEventListener('contextmenu', function (e) { e.preventDefault(); });
    document.addEventListener('selectstart', function (e) { e.preventDefault(); });
    document.addEventListener('gesturestart', function (e) { e.preventDefault(); });
  </script>
</body>
</html>
